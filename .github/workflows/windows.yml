name: Build Windows VST3 and Standalone

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build engine and preset tests
        run: cmake --build build --config Release --target VantaTests --parallel

      - name: Build editor tests
        run: cmake --build build --config Release --target VantaEditorTests --parallel

      - name: Run engine, preset, and editor tests
        shell: pwsh
        run: |
          # Keep the failure in the check annotations as well as the full log.
          # This makes test failures actionable even when log downloads are blocked.
          $ErrorActionPreference = 'Continue'
          $output = (& ctest --test-dir build -C Release --output-on-failure --no-tests=error 2>&1 | Out-String -Width 4096)
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0) {
            $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CTest failed::$escaped"
            exit $code
          }

      - name: Build VST3
        run: cmake --build build --config Release --target VantaBeta_VST3 --parallel

      - name: Build standalone application
        run: cmake --build build --config Release --target VantaBeta_Standalone --parallel

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build setup wizard
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Smoke-test install, launch, and uninstall
        shell: pwsh
        run: ./scripts/test-installer.ps1

      - name: Upload installer, standalone and VST3
        uses: actions/upload-artifact@v7
        with:
          name: Vanta-Beta-0.7-Windows
          path: |
            installer-output/Vanta-Beta-0.7-Setup.exe
            build/VantaBeta_artefacts/Release/Standalone/
            build/VantaBeta_artefacts/Release/VST3/
            build/ui-preview/
          if-no-files-found: error
