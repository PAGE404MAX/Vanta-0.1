name: Build Windows VST3 and Installer

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target VantaBeta_VST3 --parallel

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build setup wizard
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer and VST3
        uses: actions/upload-artifact@v4
        with:
          name: Vanta-Beta-0.1-Windows
          path: |
            installer-output/Vanta-Beta-0.1-Setup.exe
            build/VantaBeta_artefacts/Release/VST3/
          if-no-files-found: error
