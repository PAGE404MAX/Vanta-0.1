name: Build Windows VST3 and Standalone

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  installer-tests:
    # Fast, isolated coverage of the actual setup/uninstaller code, in parallel
    # with the full build. The main job repeats it with the real plugin/app.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create small installer test inputs
        shell: pwsh
        run: |
          $plugin = 'build/VantaBeta_artefacts/Release/VST3/Vanta Beta 0.11.vst3/Contents/x86_64-win'
          $resources = 'build/VantaBeta_artefacts/Release/VST3/Vanta Beta 0.11.vst3/Contents/Resources'
          $app = 'build/VantaBeta_artefacts/Release/Standalone'
          New-Item -ItemType Directory -Path $plugin, $resources, $app -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $plugin 'Vanta Beta 0.11.vst3') -Value 'VANTA test module'
          Set-Content -LiteralPath (Join-Path $resources 'moduleinfo.json') -Value '{"test":true}'
          Set-Content -LiteralPath (Join-Path $app 'Vanta Beta 0.11.exe') -Value 'VANTA test app'

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Compile and exercise installer and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = (& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss 2>&1 | Out-String -Width 4096)
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0) {
            $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer compilation failed::$escaped"
            exit $code
          }
          try {
            ./scripts/test-installer.ps1 -SkipLaunch
          } catch {
            $message = (($_ | Out-String) + "`n" + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer cleanup test failed::$message"
            exit 1
          }

      - name: Test the visible setup and uninstall prompts
        shell: pwsh
        timeout-minutes: 8
        run: |
          try {
            ./scripts/test-installer-ui.ps1
          } catch {
            $message = (($_ | Out-String) + "`n" + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer UI test failed::$message"
            exit 1
          }

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build engine and preset tests
        run: cmake --build build --config Release --target VantaTests --parallel

      - name: Build preset importer tests
        run: cmake --build build --config Release --target VantaImporterTests --parallel

      - name: Build editor tests
        run: cmake --build build --config Release --target VantaEditorTests --parallel

      - name: Build VST3
        run: cmake --build build --config Release --target VantaBeta_VST3 --parallel

      - name: Build VST3 host-view tests
        run: cmake --build build --config Release --target VantaVST3Tests --parallel

      - name: Run engine, preset, editor, and VST3 view tests
        shell: pwsh
        run: |
          # Keep the failure in the check annotations as well as the full log.
          # This makes test failures actionable even when log downloads are blocked.
          $ErrorActionPreference = 'Continue'
          $output = (& ctest --test-dir build -C Release --output-on-failure --no-tests=error 2>&1 | Out-String -Width 4096)
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0) {
            $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CTest failed::$escaped"
            exit $code
          }

      - name: Build standalone application
        run: cmake --build build --config Release --target VantaBeta_Standalone --parallel

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Build setup wizard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = (& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss 2>&1 | Out-String -Width 4096)
          $code = $LASTEXITCODE
          Write-Output $output
          if ($code -ne 0) {
            $escaped = $output.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer compilation failed::$escaped"
            exit $code
          }

      - name: Smoke-test install, launch, and uninstall
        shell: pwsh
        run: |
          try {
            ./scripts/test-installer.ps1
          } catch {
            $message = ($_ | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Installer smoke test failed::$message"
            exit 1
          }

      - name: Upload installer, standalone and VST3
        uses: actions/upload-artifact@v7
        with:
          name: VANTA 0.11 HERE
          path: |
            installer-output/Vanta-Beta-0.11-Setup.exe
            build/VantaBeta_artefacts/Release/Standalone/
            build/VantaBeta_artefacts/Release/VST3/
            build/ui-preview/
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
