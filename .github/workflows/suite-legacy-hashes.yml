# Temporary one-release check: exercise the actual previously published setup
# against the new script while the original build artifacts are still retained.
name: Verify previous suite upgrades
on:
  push:
    paths:
      - .github/workflows/suite-legacy-hashes.yml
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Collect the published 0.13.1 installer
        uses: actions/download-artifact@v8
        with:
          name: VANTA SUITE HERE
          run-id: 41577087672
          github-token: ${{ github.token }}
          path: build/previous-release
      - name: Prepare different current installer files
        shell: pwsh
        run: |
          $bundles = @(
            @{ Dir = 'build/VantaBeta_artefacts/Release/VST3/Vanta Beta 0.13.vst3'; Name = 'Vanta Beta 0.13.vst3' },
            @{ Dir = 'build/laggify/LaggifyFx_artefacts/Release/VST3/Laggify.vst3'; Name = 'Laggify.vst3' },
            @{ Dir = 'build/sidechain/VantaSidechainFx_artefacts/Release/VST3/VANTA Sidechain.vst3'; Name = 'VANTA Sidechain.vst3' }
          )
          foreach ($bundle in $bundles) {
            $arch = Join-Path $bundle.Dir 'Contents/x86_64-win'; $resources = Join-Path $bundle.Dir 'Contents/Resources'
            New-Item -ItemType Directory -Path $arch, $resources -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $arch $bundle.Name) -Value 'New disposable module'
            Set-Content -LiteralPath (Join-Path $resources 'moduleinfo.json') -Value '{"new":true}'
          }
          New-Item -ItemType Directory -Path 'build/VantaBeta_artefacts/Release/Standalone' -Force | Out-Null
          Set-Content -LiteralPath 'build/VantaBeta_artefacts/Release/Standalone/Vanta Beta 0.13.exe' -Value 'New disposable app'
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress }
      - name: Compile new installer with real release hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = (& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" suite-installer.iss 2>&1 | Out-String -Width 4096)
          $code = $LASTEXITCODE; Write-Output $out
          if ($code -ne 0) {
            if ($out.Length -gt 2200) { $out = $out.Substring($out.Length - 2200) }
            $message = $out.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Upgrade fixture compile failed::$message"; exit $code
          }
      - name: Upgrade the actual previous suite and preserve user files
        shell: pwsh
        run: |
          try { ./scripts/test-real-suite-upgrade.ps1 }
          catch {
            $message = (($_ | Out-String) + "`n" + $_.ScriptStackTrace).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Real previous suite upgrade failed::$message"; exit 1
          }
